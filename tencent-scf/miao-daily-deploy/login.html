<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>喵日常 · 登录</title>
  <link rel="stylesheet" href="style.login.css?v=13">
</head>
<body>

  <!-- 背景漂浮模糊圆（纯装饰） -->
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>

  <main class="login-app">

    <!-- 顶部插画 + 标题 -->
    <header class="login-hero">
      <div class="login-illustration">
        <svg viewBox="0 0 120 120" width="92" height="92" xmlns="http://www.w3.org/2000/svg">
          <circle cx="60" cy="65" r="40" fill="#FAD4A3" />
          <path d="M 28 42 Q 28 18 38 22 L 48 44 Z" fill="#FAD4A3" />
          <path d="M 32 40 Q 33 26 38 28 L 46 42 Z" fill="#F4C2C2" />
          <path d="M 92 42 Q 92 18 82 22 L 72 44 Z" fill="#FAD4A3" />
          <path d="M 88 40 Q 87 26 82 28 L 74 42 Z" fill="#F4C2C2" />
          <ellipse cx="30" cy="75" rx="8" ry="5" fill="#F4C2C2" opacity="0.6" />
          <ellipse cx="90" cy="75" rx="8" ry="5" fill="#F4C2C2" opacity="0.6" />
          <circle cx="44" cy="62" r="5" fill="#3D2F28" />
          <circle cx="46" cy="60" r="2" fill="white" />
          <circle cx="76" cy="62" r="5" fill="#3D2F28" />
          <circle cx="78" cy="60" r="2" fill="white" />
          <path d="M 56 75 Q 60 71 64 75 Q 60 79 56 75 Z" fill="#E8A672" />
          <path d="M 60 79 Q 56 84 52 82" fill="none" stroke="#3D2F28" stroke-width="1.5" stroke-linecap="round" />
          <path d="M 60 79 Q 64 84 68 82" fill="none" stroke="#3D2F28" stroke-width="1.5" stroke-linecap="round" />
          <line x1="14" y1="72" x2="28" y2="74" stroke="#9E8E82" stroke-width="1" stroke-linecap="round" />
          <line x1="14" y1="78" x2="28" y2="78" stroke="#9E8E82" stroke-width="1" stroke-linecap="round" />
          <line x1="92" y1="74" x2="106" y2="72" stroke="#9E8E82" stroke-width="1" stroke-linecap="round" />
          <line x1="92" y1="78" x2="106" y2="78" stroke="#9E8E82" stroke-width="1" stroke-linecap="round" />
        </svg>
      </div>
      <h1 class="login-title">喵日常</h1>
      <p class="login-welcome">一键开启你的小日常</p>
    </header>

    <!-- 登录卡片 -->
    <section class="login-card">
      <div class="login-card-header">
        <h2 class="login-card-title">📮 邮箱验证码登录</h2>
      </div>
      <p class="login-desc">输入邮箱，我们会发一个数字验证码过去，填上就能登录啦～手机电脑都是同一套流程</p>

      <!-- 第一步：邮箱 -->
      <form class="login-form" id="loginForm" novalidate>
        <label class="login-label" for="email">你的邮箱</label>
        <input type="email" id="email" class="login-input" placeholder="mimi@example.com" required>
        <p class="login-email-error" id="emailError">邮箱格式不对哦～</p>
        <button type="submit" class="login-submit" id="sendCode">📩 发送验证码</button>
      </form>

      <p class="login-msg" id="loginMsg" role="alert"></p>

      <!-- 第二步：数字验证码（发送成功后显示） -->
      <div class="login-step2" id="step2" style="display:none;">
        <p class="login-desc">验证码已发到 <strong id="sentTo"></strong>，查收邮件，把邮件里的数字填进来～（10 分钟内有效）</p>
        <div class="otp-row">
          <input type="text" id="otpCode" class="login-input otp-input" inputmode="numeric"
                 maxlength="10" placeholder="••••••••" autocomplete="one-time-code"
                 spellcheck="false">
          <button type="button" class="login-submit otp-verify-btn" id="verifyCode">✅ 登录</button>
        </div>
        <p class="login-msg" id="verifyMsg" role="alert"></p>
        <div class="login-step2-links">
          <button type="button" class="login-linkbtn" id="resendCode">重新发送</button>
          <span class="login-linkbtn-sep">·</span>
          <button type="button" class="login-linkbtn" id="changeEmail">换个邮箱</button>
        </div>
      </div>

      <!-- 兜底通道：验证码收不到/极端情况时，把邮件里的链接复制粘贴进来也能登录 -->
      <details class="login-paste">
        <summary class="login-paste-summary">收不到验证码？试试用邮件里的链接登录 ›</summary>
        <div class="login-paste-body">
          <p class="login-paste-tip">📱 长按邮件里的按钮 →「拷贝链接地址」→ 把整条链接粘到下面（长长的 supabase.co 链接也认），一样能登录～</p>
          <input type="text" id="pasteLink" class="login-input login-paste-input" placeholder="把邮件里的链接粘贴到这里" autocomplete="off" spellcheck="false">
          <button type="button" class="login-submit login-paste-btn" id="pasteBtn">🔗 用链接登录</button>
          <p class="login-msg" id="pasteMsg" role="alert"></p>
        </div>
      </details>

      <p class="login-hint">🐾 输入邮箱，验证码一键登录～</p>
    </section>

    <footer class="login-footer">
      <p>Made with 💛 by 咪咪大人</p>
    </footer>

  </main>

  <!-- Supabase JS SDK (UMD 全局变量 supabase) -->
  <script src="vendor/supabase-js.js?v=13"></script>
  <!-- 本地配置（含 anon key） -->
  <script src="config.js?v=13"></script>
  <!-- 初始化客户端 -->
  <script src="supabase.js?v=13"></script>
  <!-- 兜底登录：从粘贴的链接里拆凭证 -->
  <script src="linklogin.js?v=13"></script>
  <!-- 登录逻辑 -->
  <script src="auth.js?v=13"></script>
</body>
</html>
